name: Publish site

on:
  push:
    branches: [main]
  discussion:
    types: [created, edited, deleted, category_changed, transferred]
  discussion_comment:
    types: [created, deleted]
  workflow_dispatch:

permissions:
  contents: read
  discussions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build posts.json from Discussions
        run: node scripts/build-posts.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BLOG_CATEGORY: blog

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
